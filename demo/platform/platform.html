<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>µ-mural demo platform</title>

    <!-- Material Symbols Outlined — the M3 icon font. The CDN @font-face
         registers the family `Material Symbols Outlined`; mural's
         TextBlock references it via FontFamily and the canvas/SVG text
         pipelines pick it up exactly like any system font. The :opsz axis
         pin at 24 matches M3's nav-rail icon spec; FILL=0 (outlined) is
         the M3 default for rail destinations.

         Ligature-mode rendering: each TextBlock's Text is the icon NAME
         (e.g. "home", "tune") and the font's `liga` feature substitutes
         the glyph at render time. measureText runs the same substitution
         so layout sees the actual icon advance width. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        /* Full-viewport layout: html/body fill the browser window with
           no margins or document scrollbars. body is a vertical flex
           column so the header takes its natural height and #app gets
           the rest. */
        html, body { height: 100%; margin: 0; overflow: hidden;
                     background: #f1f5f9; color: #0f172a;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        /* Dark-mode chrome for the host page body so it doesn't stay
           light when Material flips. Triggered by adding
           `data-theme="dark"` on <html> from the ThemeManager.Activated
           listener below; the in-app ThemeSelector control is what the
           user actually clicks. */
        html[data-theme="dark"] body { background: #1c1b1f; color: #e6e1e5; }
        html[data-theme="dark"] #app { background: #1c1b1f; }
        /* main + #app expand to fill the window; min-height:0 lets the
           flex child actually shrink below its content-box height so
           #app doesn't push beyond the viewport. */
        main { flex: 1 1 auto; min-height: 0; padding: 0; }
        #app { box-sizing: border-box;
               width: 100%; height: 100%;
               background: #fff; overflow: hidden;
               cursor: default; }
        #app svg { display: block; }
        #status { margin: 8px 20px; color: #b91c1c; font-family: ui-monospace, monospace;
                  font-size: 13px; white-space: pre-wrap; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "@pragmatic-tech-ai/mural/runtime":        "../../dist/runtime/index.js",
            "@pragmatic-tech-ai/mural/runtime/":       "../../dist/runtime/",
            "@pragmatic-tech-ai/mural/basic":          "../../dist/basic/index.js",
            "@pragmatic-tech-ai/mural/basic/":         "../../dist/basic/",
            "@pragmatic-tech-ai/mural/framework":           "../../dist/framework/index.js",
            "@pragmatic-tech-ai/mural/framework/":          "../../dist/framework/",
            "@pragmatic-tech-ai/mural/resources/material":  "../../dist/resources/material/index.js",
            "@pragmatic-tech-ai/mural/visual-engine":  "../../dist/visual-engine/index.js",
            "@pragmatic-tech-ai/mural/visual-engine/": "../../dist/visual-engine/",
            "@pragmatic-tech-ai/todl-runtime":         "../../node_modules/@pragmatic-tech-ai/todl-runtime/dist/index.js",
            "@pragmatic-tech-ai/todl-runtime/":        "../../node_modules/@pragmatic-tech-ai/todl-runtime/dist/",
            "opentype.js":                             "../opentype-shim.mjs"
        }
    }
    </script>
</head>
<body>
    <main>
        <div id="app"></div>
    </main>
    <pre id="status"></pre>

    <script type="module">
        // The shell is driven by a DI-composed navigation model:
        // platform.mu's `.services:` block registers DemoNavigationService
        // into the shell scope, and the region content binds it through
        // `$service(NavigationService)`. The service self-populates from
        // the demo registry, so the host JS builds NO view-model and seeds
        // NO DataContext — it only mounts the shell and registers the
        // app-level storage service. No tree-walking, no FindName.
        //
        // Demo modules self-register on import (each calls `register(...)`
        // at top level — the import side effect enrolls it). These run
        // BEFORE platform.mu.js so the registry is fully populated by the
        // time the shell's `$service` bindings materialize the navigation
        // model during view construction. (The model also subscribes to
        // late registrations via registry.onDemoRegistered, so order is no
        // longer load-bearing — but keeping demos first preserves the
        // simplest, fully-synchronous population path.)
        import '../demos/dashboard/dashboard.mjs';
        import '../demos/diagram/diagram.mjs';
        import '../demos/commands/commands.mjs';
        import '../demos/ribbon/ribbon.mjs';
        import '../demos/toggle-button/toggle-button.mjs';
        import '../demos/icon-button/icon-button.mjs';
        import '../demos/fab/fab.mjs';
        import '../demos/card/card.mjs';
        import '../demos/dialog/dialog.mjs';
        import '../demos/top-app-bar/top-app-bar.mjs';
        import '../demos/navigation-rail/navigation-rail.mjs';
        import '../demos/tool-bar/tool-bar.mjs';
        import '../demos/status-bar/status-bar.mjs';
        import '../demos/menu/menu.mjs';
        import '../demos/context-menu/context-menu.mjs';
        import '../demos/counter/counter.mjs';
        import '../demos/drawer/drawer.mjs';
        import '../demos/tree-view/tree-view.mjs';
        import '../demos/list-box/list-box.mjs';
        import '../demos/text-box/text-box.mjs';
        import '../demos/spin-edit/spin-edit.mjs';
        import '../demos/slider/slider.mjs';
        import '../demos/splitter/splitter.mjs';
        import '../demos/animation/animation.mjs';
        import '../demos/animation-declarative/animation-declarative.mjs';
        import '../demos/animation-triggers/animation-triggers.mjs';
        import '../demos/animation-named/animation-named.mjs';
        import '../demos/drag-drop/drag-drop.mjs';
        import '../demos/drag-drop-extended/drag-drop-extended.mjs';
        import '../demos/word-toolbox/word-toolbox.mjs';
        import '../demos/bouncing-ball/bouncing-ball.mjs';
        import '../demos/shapes/shapes.mjs';
        import '../demos/segmented-button/segmented-button.mjs';
        import '../demos/button-group/button-group.mjs';
        import '../demos/split-button/split-button.mjs';
        import '../demos/fab-menu/fab-menu.mjs';
        import '../demos/text-on-path/text-on-path.mjs';
        import '../demos/color-picker/color-picker.mjs';
        import '../demos/pen-editor/pen-editor.mjs';
        import '../demos/fill-editor/fill-editor.mjs';
        import '../demos/text-format/text-format.mjs';
        import '../demos/rich-text-editor/rich-text-editor.mjs';
        import '../demos/rich-text-block/rich-text-block.mjs';
        import '../demos/hit-test/hit-test.mjs';
        import '../demos/badge/badge.mjs';
        import '../demos/banner/banner.mjs';
        import '../demos/bottom-app-bar/bottom-app-bar.mjs';
        import '../demos/bottom-sheet/bottom-sheet.mjs';
        import '../demos/loading-indicator/loading-indicator.mjs';
        import '../demos/side-sheet/side-sheet.mjs';
        import '../demos/date-picker/date-picker.mjs';
        import '../demos/time-picker/time-picker.mjs';
        import '../demos/carousel/carousel.mjs';
        import '../demos/property-grid/property-grid.mjs';

        import { app }                                 from './platform.mu.js';
        import { HtmlTarget }                          from '@pragmatic-tech-ai/mural/visual-engine';
        // Service + resource composition is authored in platform.mu (backlog
        // § 27): the persistence backend (DemoStorageStore → DiagramStorageKey)
        // is registered in its `.services:` block, and every demo dictionary is
        // `merge`d in its `resources:` block — so this bootstrap only enrolls the
        // demos in the registry (imports above) and mounts the shell.
        // ThemeManager.Activated fires whenever the active scheme
        // swaps — the in-app ThemeSelector control drives the swap;
        // we just mirror the current scheme name onto <html> via
        // `data-theme="dark"` so the host page body chrome flips in
        // lockstep with Material.
        import { ThemeManager, Density }
            from '@pragmatic-tech-ai/mural/runtime';
        // Material scheme classes for the OS-preference wiring below.
        // Passed as class refs (no string proxies); Application.initialize
        // resolves each to its name for ThemeManager.
        import { Material, MaterialLight, MaterialDark }
            from '@pragmatic-tech-ai/mural/resources/material';

        // Wire OS prefers-color-scheme into the active scheme at app
        // startup. The platform.mu IIFE already ran `app.initialize`
        // with the .mu file's defaultScheme (Light), so this second
        // call carries autoScheme to override that pick with the OS
        // preference. `listen: true` (the default) keeps the active
        // scheme tracking subsequent OS flips. The in-app
        // ThemeSelector still works — manual selection wins until the
        // next OS preference change fires.
        app.initialize({
            theme:      Material,
            autoScheme: { light: MaterialLight, dark: MaterialDark },
        });

        // Run the whole demo at Compact density. ThemeManager.Density is an
        // inherited attached property on the app root (Resources.Root, set
        // when platform.mu.js loaded above), so this one write cascades to
        // every control and drives their `when (ThemeManager.Density =
        // Compact)` template triggers. Set before mount so the first layout
        // is already compact.
        ThemeManager.Density = Density.Compact;

        const applyHostChrome = () => {
            const scheme = ThemeManager.ActiveScheme;
            const name = scheme?.name ?? '';
            const isDark = name.toLowerCase().includes('dark');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        };
        applyHostChrome();
        ThemeManager.AddActivatedListener(applyHostChrome);

        const status = document.getElementById('status');
        try {
            // Wait for Material Symbols Outlined to load BEFORE mounting.
            // CanvasTextMeasurer delegates to the browser's measureText,
            // which returns the fallback-font advance until the @font-face
            // resolves. Mounting earlier would lay out the rail icons
            // against the literal ligature-name widths (e.g. ~6×24px
            // for "animation") and then render the post-load 24×24 icon
            // glyph at the start of that oversized slot — visually
            // left-of-centre within the icon pill. The await pins layout
            // to the loaded-font metrics; document.fonts.load resolves as
            // soon as the variant we asked for is ready to render. The
            // size string ("24px …") matches the FontSize the rail uses;
            // browsers key the load promise on (family, size, weight,
            // style), so the size matters for the variable-font opsz
            // pick. Fonts that fail to load (CDN unreachable) reject the
            // promise, which falls into the catch below and surfaces in
            // the on-page status — better than mounting with broken text.
            await document.fonts.load('24px "Material Symbols Outlined"');

            // initialize(target) mounts the root onto the HtmlTarget. No
            // dataContext: the navigation model is the `.services:`-composed
            // DemoNavigationService, resolved by the region `$service`
            // bindings from the shell scope. The .mu IIFE already ran
            // initialize for theme activation; this second call picks up the
            // target branch and skips theme (theme is idempotent).
            app.initialize(new HtmlTarget(document.getElementById('app')));
        } catch (e) {
            status.textContent = 'Error: ' + (e?.message ?? String(e));
            console.error(e);
        }
    </script>
</body>
</html>
